spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: profile-ai
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          #model: gemini-3.8-flash
          model: gemini-3.5-flash-lite
          max-output-tokens: 500
          #thinking-level: LOW

server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health    